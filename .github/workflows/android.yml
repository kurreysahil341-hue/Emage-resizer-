name: Build Android APK & Play Store AAB (Capacitor + Gradle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build target (debug APK or Play Store signed AAB + APK)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      version_name:
        description: "App version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
        type: string

jobs:
  build-android-apk:
    name: Build ParikshaSnap Android APK & Play Store AAB
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0'

      - name: Accept any remaining Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck & build web app (dist/)
        run: |
          npm run lint
          npm run build

      - name: Initialize Capacitor Android project (if absent)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android app icon & splash screen
        run: |
          if [ -f "assets/logo.png" ]; then
            npx --yes @capacitor/assets@latest generate --android --iconBackgroundColor '#1D4ED8' --splashBackgroundColor '#1D4ED8'
          fi

      - name: Configure Play Store compliant AndroidManifest.xml
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            // Remove restricted broad-media permissions rejected by Google Play unless strictly required
            xml = xml.replace(/^\s*<uses-permission android:name="android\.permission\.READ_MEDIA_IMAGES"[^>]*>\s*$/gm, "");
            xml = xml.replace(/^\s*<uses-permission android:name="android\.permission\.CAMERA"[^>]*>\s*$/gm, "");
            const legacyPerms = [
              "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />"
            ];
            for (const p of legacyPerms) {
              const nameMatch = p.match(/android:name="([^"]+)"/)[1];
              if (!xml.includes(nameMatch)) {
                xml = xml.replace("</manifest>", `    ${p}\n</manifest>`);
              }
            }
            if (!xml.includes("requestLegacyExternalStorage")) {
              xml = xml.replace("<application", "<application android:requestLegacyExternalStorage=\"true\"");
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

      - name: Set Play Store versionCode and versionName in build.gradle
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          node -e '
            const fs = require("fs");
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const vCode = Number(process.env.APP_VERSION_CODE) || 1;
            const vName = process.env.APP_VERSION_NAME || "1.0.0";
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${vCode}`);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${vName}"`);
            fs.writeFileSync(gradlePath, gradle, "utf8");
            console.log(`Updated build.gradle -> versionCode ${vCode}, versionName ${vName}`);
          '

      - name: Sync web build with Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaSnap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Validate Keystore Secrets for Play Store Release
        if: env.HAS_KEYSTORE != 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: |
          echo "::error::Missing GitHub Secrets! Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in Repository Settings -> Secrets and variables -> Actions before running a Play Store release build."
          exit 1

      - name: Build & Sign Play Store AAB + Release APK
        if: env.HAS_KEYSTORE == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          trap 'rm -f release.keystore' EXIT

          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          AAB_OUT="app/build/outputs/bundle/release/ParikshaSnap-playstore.aab"
          cp "$AAB_SRC" "$AAB_OUT"
          jarsigner -verify -verbose "$AAB_OUT" | tail -n 5

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          APK_SIGNED_BY_GRADLE="app/build/outputs/apk/release/app-release.apk"
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_OUT="app/build/outputs/apk/release/ParikshaSnap-release-signed.apk"

          if [ -f "$APK_SIGNED_BY_GRADLE" ]; then
            cp "$APK_SIGNED_BY_GRADLE" "$APK_OUT"
          elif [ -f "$APK_UNSIGNED" ]; then
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$APK_UNSIGNED" app-release-aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$APK_OUT" \
              app-release-aligned.apk
            rm -f app-release-aligned.apk
          else
            echo "::error::Release APK output not found."
            exit 1
          fi

          "$BUILD_TOOLS_DIR/apksigner" verify "$APK_OUT"

      - name: Upload Play Store Signed AAB artifact
        if: env.HAS_KEYSTORE == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaSnap-playstore-aab
          path: android/app/build/outputs/bundle/release/ParikshaSnap-playstore.aab
          if-no-files-found: error

      - name: Upload Signed Release APK artifact
        if: env.HAS_KEYSTORE == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaSnap-release-signed-apk
          path: android/app/build/outputs/apk/release/ParikshaSnap-release-signed.apk
          if-no-files-found: error
