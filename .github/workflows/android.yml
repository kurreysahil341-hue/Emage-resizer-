name: Build Android APK (Capacitor + Gradle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-android-apk:
    name: Build ParikshaSnap Android APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0'

      - name: Accept any remaining Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install

      - name: Typecheck & build web app (dist/)
        run: |
          npm run lint
          npm run build

      - name: Initialize Capacitor Android project (if absent)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Configure AndroidManifest.xml storage & camera permissions
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
              "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />",
              "<uses-permission android:name=\"android.permission.CAMERA\" />"
            ];
            for (const p of perms) {
              const nameMatch = p.match(/android:name="([^"]+)"/)[1];
              if (!xml.includes(nameMatch)) {
                xml = xml.replace("</manifest>", `    ${p}\n</manifest>`);
              }
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

      - name: Sync web build with Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaSnap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build & Sign Release APK (when keystore secret is configured)
        if: env.HAS_KEYSTORE == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/ParikshaSnap-release-signed.apk"

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"
          rm -f release.keystore "$ALIGNED_APK"

      - name: Upload Signed Release APK artifact
        if: env.HAS_KEYSTORE == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaSnap-release-signed-apk
          path: android/app/build/outputs/apk/release/ParikshaSnap-release-signed.apk
          if-no-files-found: error
